name: actions-test
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install foolhtml
        run: |
          go install ./cmd/foolhtml
      - uses: ./
        with:
          skip-install: "true"
          output: /tmp/output.html
          inputs: testdata